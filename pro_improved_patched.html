<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問題集 Pro</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}#app{width:100%;height:100%;border:0;display:block}
#jsonTools{position:fixed;right:12px;bottom:12px;z-index:100;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#jsonTools button{border:1px solid #dfe4ec;border-radius:9px;padding:8px 11px;background:#fff;color:#172033;font-weight:700;cursor:pointer;box-shadow:0 3px 12px #17203318}
@media(max-width:760px){#jsonTools{left:10px;right:10px;bottom:10px}#jsonTools button{flex:1}}
</style>
</head>
<body>
<iframe id="app" src="./pro_improved.html" title="問題集 Pro"></iframe>
<div id="jsonTools">
 <button type="button" onclick="downloadJSON()">JSONを書き出す</button>
 <button type="button" onclick="loadGitHubJSON()">GitHubのJSONを読み込む</button>
 <button type="button" onclick="uploadJSON()">JSONファイルを読み込む</button>
 <input id="jsonFile" type="file" accept=".json,application/json" hidden>
</div>
<script>
const frame=document.getElementById('app');
const CATEGORY_KEY='problem_pro_extra_categories_v1';
function getCategories(w){let cats=new Set();try{const b=JSON.parse(w.localStorage.getItem('problem_pro_bank_v2')||'[]');b.forEach(q=>String(q.category||'').split(/[\\/>]/).map(x=>x.trim()).filter(Boolean).forEach((_,i,a)=>cats.add(a.slice(0,i+1).join(' > ')))}catch(e){}try{JSON.parse(w.localStorage.getItem(CATEGORY_KEY)||'[]').forEach(x=>cats.add(x))}catch(e){}return [...cats].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ja'))}
function saveExtra(w,c){let a=[];try{a=JSON.parse(w.localStorage.getItem(CATEGORY_KEY)||'[]')}catch(e){}if(!a.includes(c)){a.push(c);w.localStorage.setItem(CATEGORY_KEY,JSON.stringify(a))}}
function categoryControl(w,inputId){const d=w.document,input=d.getElementById(inputId);if(!input||d.getElementById(inputId+'_select'))return;const wrap=d.createElement('div');wrap.className='row';wrap.style.alignItems='stretch';const sel=d.createElement('select');sel.id=inputId+'_select';sel.style.flex='1';const add=d.createElement('button');add.className='btn';add.type='button';add.textContent='＋ジャンル追加';const sync=()=>{const cats=getCategories(w),old=input.value;sel.innerHTML='';cats.forEach(c=>{const o=d.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});if(old&&!cats.includes(old)){const o=d.createElement('option');o.value=old;o.textContent=old;sel.appendChild(o)}sel.value=old||cats[0]||'総合';input.value=sel.value};sel.onchange=()=>{input.value=sel.value};add.onclick=()=>{const c=(w.prompt('追加するジャンル名を入力してください。\n例：数学 > 幾何 > 初等幾何')||'').trim();if(!c)return;saveExtra(w,c);input.value=c;sync();sel.value=c};input.style.display='none';input.parentNode.insertBefore(wrap,input);wrap.append(sel,add);sync()}
function patch(w){const d=w.document,quiz=d.getElementById('quiz');if(quiz&&!d.getElementById('interruptQuiz')){const head=quiz.querySelector('.row'),b=d.createElement('button');b.id='interruptQuiz';b.className='btn danger small';b.textContent='中断';b.onclick=()=>{if(w.confirm('現在の出題を中断して設定画面に戻りますか？'))w.resetPlay()};head.appendChild(b)}categoryControl(w,'cat');categoryControl(w,'addCat')}
function getBank(){const w=frame.contentWindow;try{const a=JSON.parse(w.localStorage.getItem('problem_pro_bank_v2')||'[]');if(!Array.isArray(a))throw Error();return a}catch(e){alert('問題データを読み取れませんでした。');return null}}
function downloadJSON(){const bank=getBank();if(!bank)return;const blob=new Blob([JSON.stringify(bank,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='problems.json';a.click();URL.revokeObjectURL(url)}
function replaceBank(a,source){const w=frame.contentWindow;if(!Array.isArray(a)){alert('JSONの中身は配列である必要があります。');return}if(!confirm(a.length+'問で現在の問題バンクを上書きします。\n現在の問題は置き換えられます。よろしいですか？'))return;try{const normalized=a.map(q=>({...q,id:q.id||w.id(),type:q.type||'mcq',category:w.normCat(q.category)}));w.localStorage.setItem('problem_pro_bank_v2',JSON.stringify(normalized));w.bank=normalized;w.renderCats();w.renderBank();w.updateCount();alert(a.length+'問を読み込みました。'+(source?'\n'+source:''))}catch(e){alert('JSONの形式を確認してください。')}}
async function loadGitHubJSON(){try{const r=await fetch('./problems.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);replaceBank(await r.json(),'GitHub上の problems.json')}catch(e){alert('GitHubのproblems.jsonを読み込めませんでした。')}}
function uploadJSON(){document.getElementById('jsonFile').click()}
document.getElementById('jsonFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{replaceBank(JSON.parse(await f.text()),f.name)}catch(err){alert('JSON形式を確認してください。')}e.target.value=''})
frame.addEventListener('load',()=>patch(frame.contentWindow));
</script>
</body>
</html>
